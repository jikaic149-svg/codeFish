<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RobotFish 遥测</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#153344;font:16px system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:20px}section,details{background:white;border:1px solid #d4dfe7;border-radius:14px;padding:18px;margin:16px 0}
h1{font-size:25px}h2{font-size:19px;margin:0 0 14px}p{line-height:1.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.65}
button,input{font:inherit;max-width:100%}button{padding:12px;border:0;border-radius:9px;background:#087f74;color:white;cursor:pointer}button:disabled{opacity:.45}small{color:#536b7b}a{color:#087f74}
</style>
<main>
<h1>RobotFish · LoRa 遥控 / Wi-Fi 遥测</h1>
<p id="connection" role="status">正在读取机器鱼状态…</p>
<p>运动命令通过 LoRa 接收。此页面显示命令结果、执行器输出和陀螺仪数据。</p>
<section><h2>命令回传</h2><pre id="command-result">等待数据…</pre><small><a href="/lora_status" target="_blank">查看详细状态</a></small></section>
<section><h2>实时输出</h2><pre id="outputs">等待数据…</pre><small>数值表示驱动成功提交的目标，不代表实际位置或推力。</small></section>
<section><h2>JY61P 陀螺仪</h2><pre id="imu">等待数据…</pre></section>
<section><h2>陀螺仪姿态辅助</h2><pre id="attitude">等待数据…</pre><small>开启后在静止和前进时保持航向；普通松键归零保留闭环，全停关闭闭环。手动浮沉与转向优先，松开转向后保持新航向。</small></section>
<details><summary>固件升级</summary><p>选择本工程的 RobotFish 应用 BIN。写入前自动全停，完成后重启。</p>
<input id="firmware" type="file" accept=".bin"><button id="upload">上传固件</button><pre id="ota-result"></pre></details>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const modes={1:'仿生',2:'螺旋桨',3:'混合'};
const number=value=>Number.isFinite(value)?value.toFixed(1):'—';
const vector=(sample,unit)=>sample?.valid?`${number(sample.x)}, ${number(sample.y)}, ${number(sample.z)} ${unit}（${sample.age_ms} ms 前）`:'尚未收到有效数据';
async function poll(){
 try{
  const response=await fetch('/motion_status',{cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status}`);
  const s=await response.json(),r=s.command_result||{},l=s.lora||{},f=s.last_written||{},i=s.imu||{};
  $('connection').textContent=`Wi-Fi 已连接 · ${modes[s.mode]||'未知模式'} · ${s.safety_state||'未知状态'}`;
  $('command-result').textContent=(r.available?`来源 ${r.source} · 序号 ${r.sequence} · 命令 ${r.code}\n结果：${r.result}\n`:'尚未收到命令\n')+`LoRa 接收：${l.accepted||0} · 拒绝：${l.rejected||0} · 重复：${l.duplicates||0}\n最近成功回执：${l.last_ack||'—'}`;
  $('outputs').textContent=`前尾 ${number(f.tail_front_deg)}° · 后尾 ${number(f.tail_rear_deg)}°\n左鳍 ${number(f.pectoral_left_deg)}° · 右鳍 ${number(f.pectoral_right_deg)}°\n左桨 ${number(f.left_motor_pct)}% · 右桨 ${number(f.right_motor_pct)}%\n输出故障：${s.output_fault?'锁定':s.output_recovery?'恢复中':s.output_warning?'告警':'无'}`;
  $('imu').textContent=`串口：${i.uart_ready?'已初始化':'未就绪'} · ${i.baud||'—'} bps\n加速度：${vector(i.acceleration_g,'g')}\n角速度：${vector(i.angular_velocity_dps,'°/s')}\n姿态角：${vector(i.angles_deg,'°')}\n有效帧 ${i.frames||0} · 校验错误 ${i.checksum_errors||0} · 接收错误 ${i.receive_errors||0}`;
  const a=s.attitude_control||{},states={disabled:'已关闭',uncalibrated:'轴向或执行器方向未标定',waiting_motion:'当前未允许闭环（倒退或停机期间）',imu_unavailable:'没有有效 IMU 数据',imu_stale:'IMU 数据过期',invalid_sample:'IMU 数据无效',manual_pitch:'手动浮沉优先',manual_yaw:'手动转向优先',heading_unavailable:'航向暂不可用',active:'辅助生效'};
  $('attitude').textContent=s.attitude_control_supported?`请求：${a.enabled?'开启':'关闭'} · 快照状态：${states[a.reason]||'未知'}\nyaw 纠偏范围：±${number(a.yaw_max_correction_pct)}%\n标定：俯仰 ${a.pitch_calibrated?'已确认':'未确认'} · 横滚 ${a.roll_calibrated?'已确认':'未确认'} · 航向 ${a.yaw_calibrated?'已确认':'未确认'}\n修正：俯仰 ${number(a.pitch_correction_pct)}% · 横滚 ${number(a.roll_correction_pct)}% · 偏航 ${number(a.yaw_correction_pct)}%\n相对航向目标：${a.heading_locked?number(a.heading_target_deg)+'°':'未锁定'}`:'此固件尚未提供姿态辅助';
 }catch(error){$('connection').textContent=`状态读取失败：${error.message}。下方保留上次读取结果。`;}
 setTimeout(poll,500);
}
$('upload').addEventListener('click',async()=>{
 const file=$('firmware').files[0];if(!file){$('ota-result').textContent='请先选择应用 BIN。';return;}
 $('upload').disabled=true;$('ota-result').textContent='正在全停并上传固件…';
 try{
  const response=await fetch('/ota_upload',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});
  const text=await response.text();if(!response.ok)throw Error(text);
  $('ota-result').textContent='固件已提交，机器鱼正在重启。重启后请重新读取状态。';
 }catch(error){$('ota-result').textContent=`升级失败：${error.message}`;}
 finally{$('upload').disabled=false;}
});
poll();
</script>
</html>
